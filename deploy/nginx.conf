log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # $uri omits the sensitive OpenID query and one-time start codes.
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 16k;
    # Only the fixed host gateway is trusted to supply a sanitized client IP.
    set_real_ip_from 172.30.75.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/security-headers.conf;
    location /api/ {
        proxy_pass http://api:3000;
        # Forward a single sanitized IP; discard user-provided forwarding chains.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health { proxy_pass http://api:3000; }
    location = /ready { proxy_pass http://api:3000; }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
