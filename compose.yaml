name: squad
services:
  api:
    profiles: ['app']
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-squad}:${POSTGRES_PASSWORD:-squad_local_only}@postgres:5432/${POSTGRES_DB:-squad}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  bot:
    profiles: ['app']
    build:
      context: .
      target: bot
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped
  miniapp:
    profiles: ['app']
    build:
      context: .
      target: miniapp
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:80'
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squad_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-squad}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
